name: Centralized Org APT Builder & Publisher

on:
  repository_dispatch:
    types: [build-and-publish]
  workflow_dispatch:
    inputs:
      target_repo:
        description: 'Repository to build (e.g., your-org/cutie-shell)'
        required: true
      target_ref:
        description: 'Branch or tag to build (e.g., refs/heads/main)'
        required: true
        default: 'refs/heads/main'

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Determine Target Repository
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "repository_dispatch" ]; then
            echo "repo=${{ github.event.client_payload.repository }}" >> $GITHUB_OUTPUT
            echo "ref=${{ github.event.client_payload.ref }}" >> $GITHUB_OUTPUT
          else
            echo "repo=${{ inputs.target_repo }}" >> $GITHUB_OUTPUT
            echo "ref=${{ inputs.target_ref }}" >> $GITHUB_OUTPUT
          fi
          echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Extract Repo Name for Release Tags
        id: repo_name
        run: echo "short=$(echo ${{ steps.vars.outputs.repo }} | cut -d'/' -f2)" >> $GITHUB_OUTPUT

      - name: Checkout Target Code
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.vars.outputs.repo }}
          ref: ${{ steps.vars.outputs.ref }}
          path: source-code
          # No token required here because all source repositories are public

      - name: Checkout Existing APT Pages Pool
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
        continue-on-error: true # Safely ignores failures on the very first run

      - name: Install Build Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts equivs build-essential dpkg-dev apt-utils apt
          apt-ftparchive --version

      - name: Install Dependencies
        working-directory: source-code
        run: |
          sudo mk-build-deps --install \
            --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' \
            debian/control

      - name: Build .deb Package
        working-directory: source-code
        run: |
          dpkg-buildpackage -us -uc -b
          mkdir -p ../new-output
          mv ../*.deb ../new-output/
          mv ../*.changes ../new-output/ || true

      - name: Create Target-Specific GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-${{ steps.repo_name.outputs.short }}
          name: Latest Build - ${{ steps.repo_name.outputs.short }}
          body: |
            Automated build triggered by ${{ steps.vars.outputs.repo }}.
            Branch/Ref: ${{ steps.vars.outputs.ref }}
            Built on: ${{ steps.vars.outputs.date }}
          files: new-output/*.deb
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --import --batch
          echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
          echo "no-tty" >> ~/.gnupg/gpg.conf
          gpg-connect-agent reloadagent /bye

      - name: Generate APT repository structure
        env:
          GNUPGHOME: /home/runner/.gnupg
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          USER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public/pool/main
          mkdir -p public/dists/stable/main/binary-arm64

          # Copy newly built debs into the existing pool
          cp new-output/*.deb public/pool/main/

          # Export public GPG key
          gpg --armor --export $GPG_KEY_ID > public/repo.gpg

          cd public
          
          # Rebuild the packages index with both old and new files
          dpkg-scanpackages --arch arm64 pool/main /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          cd dists/stable
          cat << EOF > Release
          Origin: https://$USER.github.io/$REPO
          Label: Organization APT Repository
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: arm64
          Components: main
          Description: Centralized Debian packages for the organization
          EOF

          apt-ftparchive release . >> Release

          # Sign Release
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key $GPG_KEY_ID --clearsign -o InRelease Release
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key $GPG_KEY_ID -abs -o Release.gpg Release

      - name: Generate index page
        env:
          USER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          REPO_URL="https://$USER.github.io/$REPO"
          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Organization APT Repository</title>
            <style>
              body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
              pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
              h1, h2 { font-family: sans-serif; }
            </style>
          </head>
          <body>
            <h1>Organization APT Repository</h1>
            <h2>1. Add GPG key</h2>
            <pre>curl ${REPO_URL}/repo.gpg | sudo tee /etc/apt/trusted.gpg.d/org-repo.gpg</pre>
            <h2>2. Add repository</h2>
            <pre>echo "deb ${REPO_URL} stable main" | sudo tee /etc/apt/sources.list.d/org-repo.list
          sudo apt-get update</pre>
          </body>
          </html>
          EOF

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

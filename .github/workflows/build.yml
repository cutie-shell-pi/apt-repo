name: Centralized Org APT Auto-Scanner & Publisher

on:
  workflow_dispatch: # A single-click button with no inputs required
  schedule:
    - cron: '0 */6 * * *' # Optional: Automatically runs every 6 hours to check for changes

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  scan-and-build:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout Existing APT Pages Pool & State
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: public
        continue-on-error: true

      - name: Install Build & Parsing Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y devscripts equivs build-essential dpkg-dev apt-utils apt jq
          mkdir -p new-output

      - name: Scan Organization Repositories
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ORG="${{ github.repository_owner }}"
          CURRENT_REPO="${{ github.event.repository.name }}"
          
          # Initialize state tracking file if it doesn't exist
          if [ ! -f public/state.json ]; then
            echo "{}" > public/state.json
          fi

          echo "Fetching public repositories for organization: $ORG..."
          # Retrieve all public, non-fork repository names in the organization
          REPOS=$(gh api orgs/$ORG/repos --paginate --jq '.[] | select(.fork == false) | .name')

          for REPO in $REPOS; do
            # Skip this central APT repository itself
            if [ "$REPO" = "$CURRENT_REPO" ]; then
              continue
            fi

            echo "--------------------------------------------------"
            echo "Checking entry: $REPO"
            
            # Fetch latest commit SHA of the default branch
            LATEST_SHA=$(gh api repos/$ORG/$REPO/commits/HEAD --jq '.sha' 2>/dev/null || echo "")
            if [ -z "$LATEST_SHA" ]; then
              echo " -> Could not resolve default branch HEAD for $REPO. Skipping."
              continue
            fi

            # Read the last successfully built SHA from the state file
            LAST_SHA=$(jq -r --arg repo "$REPO" '.[$repo] // ""' public/state.json)

            if [ "$LATEST_SHA" = "$LAST_SHA" ]; then
              echo " -> No new commits detected ($LATEST_SHA). Up to date."
              continue
            fi

            echo " -> New changes found! (Old: ${LAST_SHA:-None} -> New: $LATEST_SHA)"
            
            # Quick structural validation: check if the repo actually contains a debian recipe
            HAS_DEBIAN=$(gh api repos/$ORG/$REPO/contents/debian/control --jq '.name' 2>/dev/null || echo "")
            if [ -z "$HAS_DEBIAN" ]; then
              echo " -> Repository does not contain debian/control. Marking as checked and skipping."
              jq --arg repo "$REPO" --arg sha "$LATEST_SHA" '.[$repo] = $sha' public/state.json > tmp.json && mv tmp.json public/state.json
              continue
            fi

            echo " -> Valid Debian package package found. Proceeding to build environment..."
            
            # Shallow clone target source code
            git clone --depth 1 https://github.com/$ORG/$REPO.git source-code
            
            # Install package dependencies
            cd source-code
            sudo mk-build-deps --install \
              --tool='apt-get -o Debug::pkgProblemResolver=yes --no-install-recommends --yes' \
              debian/control || echo "Dependency installation experienced warnings."

            # Compile binary distribution package
            dpkg-buildpackage -us -uc -b || echo "Build failed for $REPO."
            
            # Gather output artifacts out of the parent workspace
            cd ..
            mv *.deb new-output/ 2>/dev/null || true
            mv *.changes new-output/ 2>/dev/null || true
            rm -rf source-code

            # Record the new SHA status to state registry
            jq --arg repo "$REPO" --arg sha "$LATEST_SHA" '.[$repo] = $sha' public/state.json > tmp.json && mv tmp.json public/state.json
          done

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          if [ -n "$GPG_PRIVATE_KEY" ]; then
            echo "$GPG_PRIVATE_KEY" | gpg --import --batch
            echo "allow-preset-passphrase" > ~/.gnupg/gpg-agent.conf
            echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf
            echo "no-tty" >> ~/.gnupg/gpg.conf
            gpg-connect-agent reloadagent /bye
          fi

      - name: Regenerate APT Repository Structure
        env:
          GNUPGHOME: /home/runner/.gnupg
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          USER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          mkdir -p public/pool/main
          mkdir -p public/dists/stable/main/binary-arm64

          # Integrate any freshly generated packages into our primary pool
          if [ "$(ls -A new-output/*.deb 2>/dev/null)" ]; then
            cp new-output/*.deb public/pool/main/
          fi

          # Export public GPG verification key
          gpg --armor --export $GPG_KEY_ID > public/repo.gpg

          cd public
          
          # Rebuild entire package registry index
          dpkg-scanpackages --arch arm64 pool/main /dev/null > dists/stable/main/binary-arm64/Packages
          gzip -k -f dists/stable/main/binary-arm64/Packages

          cd dists/stable
          cat << EOF > Release
          Origin: https://$USER.github.io/$REPO
          Label: Organization APT Repository
          Suite: stable
          Codename: stable
          Version: 1.0
          Architectures: arm64
          Components: main
          Description: Centralized Debian packages for the organization
          EOF

          apt-ftparchive release . >> Release

          # Re-sign repository definitions
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key $GPG_KEY_ID --clearsign -o InRelease Release
          echo "$GPG_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --default-key $GPG_KEY_ID -abs -o Release.gpg Release

      - name: Generate Index Interface Page
        env:
          USER: ${{ github.repository_owner }}
          REPO: ${{ github.event.repository.name }}
        run: |
          REPO_URL="https://$USER.github.io/$REPO"
          cat << EOF > public/index.html
          <!DOCTYPE html>
          <html>
          <head>
            <title>Organization APT Repository</title>
            <style>
              body { font-family: monospace; max-width: 800px; margin: 40px auto; padding: 0 20px; }
              pre { background: #f4f4f4; padding: 15px; border-radius: 5px; overflow-x: auto; }
              h1, h2 { font-family: sans-serif; }
            </style>
          </head>
          <body>
            <h1>Organization APT Repository</h1>
            <h2>1. Add GPG key</h2>
            <pre>curl ${REPO_URL}/repo.gpg | sudo tee /etc/apt/trusted.gpg.d/org-repo.gpg</pre>
            <h2>2. Add repository</h2>
            <pre>echo "deb ${REPO_URL} stable main" | sudo tee /etc/apt/sources.list.d/org-repo.list
          sudo apt-get update</pre>
          </body>
          </html>
          EOF

      - name: Commit Package Pool & Scanner State
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          force_orphan: true

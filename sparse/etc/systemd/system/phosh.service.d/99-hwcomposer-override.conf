[Unit]
After=lxc@android.service android-service@hwcomposer.service
Requires=android-service@hwcomposer.service
BindsTo=android-service@hwcomposer.service

[Service]

# --- Force environment like your working script ---
Environment=XDG_RUNTIME_DIR=/run/user/0
Environment=WLR_BACKENDS=hwcomposer,libinput
Environment=EGL_PLATFORM=hwcomposer
Environment=WLR_HWC_SKIP_VERSION_CHECK=1
Environment=LD_LIBRARY_PATH=/usr/lib/aarch64-linux-gnu/hwcomposer-backend:/usr/lib/aarch64-linux-gnu/hybris-hwcomposer:$LD_LIBRARY_PATH

# --- IMPORTANT: ensure same compositor behavior ---
ExecStart=
ExecStart=/usr/bin/dbus-run-session /usr/bin/phoc -v -S -C /usr/share/phosh/phoc.ini -E "gnome-session --disable-acceleration-check --session=phosh"








